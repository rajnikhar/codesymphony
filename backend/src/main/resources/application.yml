server:
  port: 8090

spring:
  application:
    name: codesymphony-core

codesymphony:
  max-ingested-files: 800
  max-visible-nodes: 150
  parser-base-url: http://localhost:8001
  clone-dir: ${java.io.tmpdir}/codesymphony-clones
  history-only-parseable-ratio: 0.05
  history-only-min-edge-count: 1
  # Hard ceiling only — protects local disk/CPU; normal large repos are sampled instead.
  max-repository-files-before-reject: 250000
  max-history-sample-files: 300
  clone-depth: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.codesymphony: INFO
